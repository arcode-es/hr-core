# Servidor: `docker compose up -d --build`. No publica ningún puerto en el equipo: el proxy inverso
# llega a `web` y `api` por la red de Docker (ver docker-compose.proxy.yml y docs/es/avanzado.md).
# En local, con puertos en 127.0.0.1: `pnpm docker:up`. Solo infraestructura: `pnpm infra:up`.
#
# MinIO y su copia solo arrancan con el perfil `s3` (COMPOSE_PROFILES=s3 en .env); con
# STORAGE_DRIVER=local no hacen falta. Sin probar: las imágenes oficiales minio/minio y minio/mc
# han dejado de publicarse; hay que sustituirlas antes de usar ese perfil.
name: hr-gestion

x-env: &env
  env_file:
    - path: .env
      required: false

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hr_gestion}
      TZ: UTC
      PGTZ: UTC
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      # Por TCP: en el primer arranque la imagen levanta un servidor temporal que solo escucha en el
      # socket; sin -h se daba por listo, la API intentaba migrar y fallaba con P1001.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-hr} -d ${POSTGRES_DB:-hr_gestion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-hr_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-hr_minio_dev_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket privado (los archivos solo se sirven con URLs prefirmadas).
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hr_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-hr_minio_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-hr-gestion}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET
      "

  api:
    # Imagen publicada; `docker compose build` la compila desde este código si lo prefieres.
    image: ${HR_CORE_REGISTRY:-ghcr.io/arcode-es}/hr-core-api:${HR_CORE_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    <<: *env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hr}:${POSTGRES_PASSWORD:-hr_dev_password}@postgres:5432/${POSTGRES_DB:-hr_gestion}?schema=public
      S3_ENDPOINT: http://minio:9000
      API_PORT: 3000
      STORAGE_LOCAL_DIR: /repo/apps/api/storage
    mem_limit: ${API_MEM_LIMIT:-768m}
    volumes:
      # Solo se usa con STORAGE_DRIVER=local.
      - api_storage:/repo/apps/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      # Solo con el perfil s3; sin él, la API arranca sin esperar a MinIO.
      minio-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Las migraciones y la primera siembra de la demo tardan: no cuentan como fallo.
      start_period: 90s

  web:
    image: ${HR_CORE_REGISTRY:-ghcr.io/arcode-es}/hr-core-web:${HR_CORE_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Solo al compilar tú la imagen: la publicada usa la API en /api/v1 del mismo dominio y la raíz.
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    environment:
      # Nombre de la app (título, app instalada y pantallas). Se aplica al arrancar el contenedor.
      APP_NAME: ${APP_NAME:-HR-Core}
    mem_limit: ${WEB_MEM_LIMIT:-128m}
    depends_on:
      api:
        condition: service_healthy

  # Copia diaria de la base de datos (y de los archivos si STORAGE_DRIVER=local).
  backup-db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    mem_limit: ${BACKUP_MEM_LIMIT:-256m}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-hr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-hr_dev_password}
      PGDATABASE: ${POSTGRES_DB:-hr_gestion}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${JOBS_TIMEZONE:-Europe/Madrid}
    entrypoint: ["/bin/sh", "/scripts/backup-db.sh"]
    volumes:
      - ./infra/backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - api_storage:/storage:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Espejo diario del bucket de MinIO (fotos, tickets y documentos).
  backup-files:
    image: minio/mc:latest
    profiles: ["s3"]
    restart: unless-stopped
    mem_limit: ${BACKUP_MEM_LIMIT:-256m}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hr_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-hr_minio_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-hr-gestion}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      TZ: ${JOBS_TIMEZONE:-Europe/Madrid}
    entrypoint: ["/bin/sh", "/scripts/backup-files.sh"]
    volumes:
      - ./infra/backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  api_storage:
