# La web compilada. Si se publica bajo una ruta (p. ej. /HR-core), el proxy quita ese prefijo
# antes de pasar la petición y la web se compila con VITE_BASE_PATH=/HR-core.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # nginx no conoce .webmanifest ni .mjs y los serviría como application/octet-stream;
  # el navegador se niega a cargar así el módulo del visor de PDF (pdf.worker.min-*.mjs).
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
    application/javascript mjs;
  }

  # SPA: cualquier ruta desconocida la resuelve el router del cliente.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # El service worker, el manifiesto y la página no se cachean: así llegan las actualizaciones.
  location ~ ^/(sw\.js|push-sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html|config\.js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
