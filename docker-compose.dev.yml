# Uso en local: publica los puertos solo en 127.0.0.1 (nunca en todas las interfaces:
# Docker se salta el cortafuegos del equipo). Lo usan `pnpm infra:up` y `pnpm docker:up`.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  minio:
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
  api:
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
