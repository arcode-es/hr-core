# Publica las imágenes de la API y de la web en GitHub Container Registry al etiquetar una versión
# (v1.2.3), para amd64 y arm64. Cada arquitectura se compila en un ejecutor nativo (sin emulación,
# que es lenta y puede colgarse) y después se unen en una sola imagen multiplataforma.
name: Imágenes

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
        plataforma:
          - { nombre: linux/amd64, ejecutor: ubuntu-24.04, sufijo: amd64 }
          - { nombre: linux/arm64, ejecutor: ubuntu-24.04-arm, sufijo: arm64 }
    runs-on: ${{ matrix.plataforma.ejecutor }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hr-core-${{ matrix.app }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.plataforma.nombre }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          # Se sube solo por su huella; las etiquetas las pone el paso de unión.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/hr-core-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.plataforma.sufijo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.plataforma.sufijo }}
      - name: Guardar la huella
        run: |
          mkdir -p /tmp/huellas
          touch "/tmp/huellas/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: huellas-${{ matrix.app }}-${{ matrix.plataforma.sufijo }}
          path: /tmp/huellas/*
          retention-days: 1

  unir:
    needs: compilar
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: huellas-${{ matrix.app }}-*
          path: /tmp/huellas
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hr-core-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Imagen multiplataforma con sus etiquetas
        working-directory: /tmp/huellas
        env:
          IMAGEN: ghcr.io/${{ github.repository_owner }}/hr-core-${{ matrix.app }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGEN@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGEN:${{ steps.meta.outputs.version }}"

  release:
    needs: unir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notas de la versión
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} p && /^## / {exit} p' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versión $v" > notas.md
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "HR-Core $GITHUB_REF_NAME" --notes-file notas.md --verify-tag
