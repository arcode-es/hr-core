# Pruebas en cada cambio: tipos, API contra PostgreSQL + PostGIS y recorridos de navegador.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr_ci_password
          POSTGRES_DB: hr_gestion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr -d hr_gestion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://hr:hr_ci_password@localhost:5432/hr_gestion?schema=public
      # Secretos solo de prueba: la API exige 32 caracteres como mínimo.
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345678
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage
      EMAIL_DRIVER: log
      VITE_API_URL: http://localhost:3000/api/v1
      CI: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar
        run: pnpm build

      - name: Migraciones
        run: pnpm --filter @hr/api exec prisma migrate deploy

      - name: Tipos
        run: pnpm -r typecheck

      - name: Pruebas de la API
        run: pnpm test

      - name: Navegador para los recorridos
        run: pnpm --filter @hr/e2e exec playwright install --with-deps chromium

      - name: Recorridos de navegador
        run: pnpm e2e --trace off

      - name: Capturas de los fallos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-resultados
          path: apps/e2e/test-results
          retention-days: 7

  # Las imágenes también se compilan en cada cambio: un Dockerfile roto (p. ej. una versión base
  # incompatible) no lo detectan las pruebas de arriba, que no usan Docker.
  imagenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: hr-core-${{ matrix.app }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.app }}
      - name: Arranca
        run: |
          if [ "${{ matrix.app }}" = web ]; then
            docker run -d --name prueba -p 8080:80 -e APP_NAME="Prueba CI" hr-core-web:ci
            for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/ | grep -q "<title>Prueba CI</title>" && exit 0; sleep 1; done
            docker logs prueba; exit 1
          else
            docker run --rm hr-core-api:ci node -e "require('argon2').hash('x').then(() => console.log('argon2 ok')); require('@prisma/client')"
          fi

