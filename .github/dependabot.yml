version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Las versiones mayores cambian la API de la librería: se actualizan a mano, con pruebas.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: monthly }
    ignore:
      # Los saltos de versión mayor de Node se hacen a mano y probados (Node 25+ ya no trae corepack).
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: monthly }
    ignore:
      # Los saltos de versión mayor de Node se hacen a mano y probados (Node 25+ ya no trae corepack).
      - dependency-name: node
        update-types: [version-update:semver-major]
